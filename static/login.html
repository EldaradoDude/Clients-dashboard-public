<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Trading Viewer</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Unbounded:wght@700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/login-page.js"></script>
</head>
<body>
  <main>
    <form class="login" id="login">
      <h1>Trading Viewer</h1>
      <label>Username <input id="username" name="username" autocomplete="username" required autofocus></label>
      <label>Password <input id="password" name="password" type="password" autocomplete="current-password" required></label>
      <div class="message error" id="error" role="alert" hidden></div>
      <button class="primary" id="submit">Log in</button>
    </form>
  </main>
</body>
</html>
